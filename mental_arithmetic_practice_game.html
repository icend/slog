<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心算练习游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        /* 左侧控制区 */
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .stats-item {
            margin-bottom: 8px;
        }

        .stats-item:last-child {
            margin-bottom: 0;
        }

        .correct-rate {
            font-size: 18px;
            font-weight: 600;
            color: #27ae60;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .radio-label:hover {
            background-color: #f8f9fa;
        }

        input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* 右侧题目区 */
        .questions-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
            text-align: center;
        }

        .question-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: #fafbfc;
            border-radius: 8px;
            font-size: 20px;
        }

        .question-number {
            width: 30px;
            font-weight: 500;
            color: #7f8c8d;
        }

        .question-expression {
            flex-shrink: 0;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .answer-input {
            width: 80px;
            padding: 5px 8px;
            font-size: 20px;
            border: none;
            border-bottom: 2px solid #bdc3c7;
            background: transparent;
            text-align: center;
            outline: none;
            font-family: 'Consolas', 'Monaco', monospace;
            transition: border-color 0.2s;
        }

        .answer-input:focus {
            border-bottom-color: #3498db;
        }

        .answer-input.correct {
            border-bottom-color: #27ae60;
            color: #27ae60;
        }

        .answer-input.wrong {
            border-bottom-color: #e74c3c;
            color: #e74c3c;
        }

        .result-mark {
            font-size: 22px;
            font-weight: bold;
            width: 25px;
            text-align: center;
        }

        .result-mark.correct {
            color: #27ae60;
        }

        .result-mark.wrong {
            color: #e74c3c;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 20px;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
            }

            .stats {
                order: 3;
                width: 100%;
            }

            .btn {
                flex: 1;
            }

            .radio-group {
                flex-direction: row;
                gap: 20px;
            }

            .question-item {
                font-size: 18px;
                padding: 12px 15px;
            }

            .answer-input {
                width: 60px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧控制区 -->
        <div class="sidebar">
            <div class="stats">
                <div class="stats-item">答题进度：<span id="progress">0/5</span></div>
                <div class="stats-item">正确：<span id="correct-count">0</span> | 错误：<span id="wrong-count">0</span></div>
                <div class="stats-item">正确率：<span class="correct-rate" id="correct-rate">0%</span></div>
            </div>
            
            <button class="btn" id="refresh-btn">重新出题</button>
            
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="question-count" value="5" checked>
                    <span>5道题</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="question-count" value="10">
                    <span>10道题</span>
                </label>
            </div>
        </div>

        <!-- 右侧题目区 -->
        <div class="questions-area">
            <h1 class="title">心算练习</h1>
            <div id="questions-container"></div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const questionsContainer = document.getElementById('questions-container');
        const refreshBtn = document.getElementById('refresh-btn');
        const radioInputs = document.querySelectorAll('input[name="question-count"]');
        const progressEl = document.getElementById('progress');
        const correctCountEl = document.getElementById('correct-count');
        const wrongCountEl = document.getElementById('wrong-count');
        const correctRateEl = document.getElementById('correct-rate');

        let currentQuestions = [];

        // 生成随机整数，包含min和max
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 生成单道题目，返回{expression: 显示的算式, answer: 正确答案}
        function generateQuestion() {
            const types = [
                // 类型1：a + b * c
                () => {
                    const a = randomInt(1, 30);
                    const b = randomInt(2, 12);
                    const c = randomInt(2, 12);
                    return {
                        expression: `${a} + ${b} × ${c}`,
                        answer: a + b * c
                    };
                },
                // 类型2：a * b - c
                () => {
                    const a = randomInt(2, 12);
                    const b = randomInt(2, 12);
                    const c = randomInt(1, 30);
                    const res = a * b;
                    return {
                        expression: `${a} × ${b} - ${c}`,
                        answer: res - c > 0 ? res - c : res + c // 避免负数结果
                    };
                },
                // 类型3：a * (b + c)
                () => {
                    const a = randomInt(2, 9);
                    const b = randomInt(2, 20);
                    const c = randomInt(2, 20);
                    return {
                        expression: `${a} × (${b} + ${c})`,
                        answer: a * (b + c)
                    };
                },
                // 类型4：(a + b) * c
                () => {
                    const a = randomInt(2, 20);
                    const b = randomInt(2, 20);
                    const c = randomInt(2, 9);
                    return {
                        expression: `(${a} + ${b}) × ${c}`,
                        answer: (a + b) * c
                    };
                },
                // 类型5：a + b - c
                () => {
                    const a = randomInt(10, 50);
                    const b = randomInt(10, 50);
                    const c = randomInt(1, Math.min(a + b - 1, 50));
                    return {
                        expression: `${a} + ${b} - ${c}`,
                        answer: a + b - c
                    };
                },
                // 类型6：a ÷ b + c （保证整除）
                () => {
                    const b = randomInt(2, 9);
                    const res = randomInt(2, 12);
                    const a = b * res;
                    const c = randomInt(1, 20);
                    return {
                        expression: `${a} ÷ ${b} + ${c}`,
                        answer: res + c
                    };
                },
                // 类型7：(a - b) × c
                () => {
                    const a = randomInt(20, 50);
                    const b = randomInt(2, 19);
                    const c = randomInt(2, 9);
                    return {
                        expression: `(${a} - ${b}) × ${c}`,
                        answer: (a - b) * c
                    };
                },
                // 类型8：a × b + c × d
                () => {
                    const a = randomInt(2, 9);
                    const b = randomInt(2, 9);
                    const c = randomInt(2, 9);
                    const d = randomInt(2, 9);
                    return {
                        expression: `${a} × ${b} + ${c} × ${d}`,
                        answer: a * b + c * d
                    };
                }
            ];

            // 随机选一种题型生成
            const typeIndex = randomInt(0, types.length - 1);
            return types[typeIndex]();
        }

        // 生成指定数量的题目
        function generateQuestions(count) {
            currentQuestions = [];
            for (let i = 0; i < count; i++) {
                currentQuestions.push(generateQuestion());
            }
            renderQuestions();
            resetStats();
        }

        // 渲染题目到页面
        function renderQuestions() {
            questionsContainer.innerHTML = '';
            currentQuestions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'question-item';
                
                item.innerHTML = `
                    <span class="question-number">${index + 1}.</span>
                    <span class="question-expression">${q.expression} =</span>
                    <input type="number" class="answer-input" data-index="${index}" autocomplete="off">
                    <span class="result-mark" data-index="${index}"></span>
                `;
                
                questionsContainer.appendChild(item);
            });

            // 绑定事件：输入时先清除旧标记，失去焦点后再判分
            const inputs = document.querySelectorAll('.answer-input');
            inputs.forEach(input => {
                input.addEventListener('input', handleTyping);
                input.addEventListener('blur', checkAnswer);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const index = parseInt(e.target.dataset.index);
                        if (index < currentQuestions.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            refreshBtn.focus();
                        }
                    }
                });
            });
        }

        // 输入过程中：清除该题此前的判分标记，等待失去焦点后再判定
        function handleTyping(e) {
            const input = e.target;
            const index = parseInt(input.dataset.index);
            const markEl = document.querySelector(`.result-mark[data-index="${index}"]`);

            input.classList.remove('correct', 'wrong');
            markEl.classList.remove('correct', 'wrong');
            markEl.textContent = '';
            updateStats();
        }

        // 失去焦点后检查答案
        function checkAnswer(e) {
            const input = e.target;
            const index = parseInt(input.dataset.index);
            const markEl = document.querySelector(`.result-mark[data-index="${index}"]`);
            const userAnswer = parseInt(input.value.trim());
            const correctAnswer = currentQuestions[index].answer;

            if (input.value.trim() === '' || isNaN(userAnswer)) {
                input.classList.remove('correct', 'wrong');
                markEl.classList.remove('correct', 'wrong');
                markEl.textContent = '';
                updateStats();
                return;
            }

            if (userAnswer === correctAnswer) {
                input.classList.remove('wrong');
                input.classList.add('correct');
                markEl.classList.remove('wrong');
                markEl.classList.add('correct');
                markEl.textContent = '√';
            } else {
                input.classList.remove('correct');
                input.classList.add('wrong');
                markEl.classList.remove('correct');
                markEl.classList.add('wrong');
                markEl.textContent = '×';
            }

            updateStats();
        }

        // 更新统计数据
        function updateStats() {
            const inputs = document.querySelectorAll('.answer-input');
            let answered = 0;
            let correct = 0;
            let wrong = 0;

            inputs.forEach(input => {
                // 仅统计已判定（失去焦点后）的题目
                if (input.classList.contains('correct')) {
                    answered++;
                    correct++;
                } else if (input.classList.contains('wrong')) {
                    answered++;
                    wrong++;
                }
            });

            progressEl.textContent = `${answered}/${currentQuestions.length}`;
            correctCountEl.textContent = correct;
            wrongCountEl.textContent = wrong;
            const rate = answered === 0 ? 0 : Math.round((correct / answered) * 100);
            correctRateEl.textContent = `${rate}%`;
        }

        // 重置统计
        function resetStats() {
            progressEl.textContent = `0/${currentQuestions.length}`;
            correctCountEl.textContent = '0';
            wrongCountEl.textContent = '0';
            correctRateEl.textContent = '0%';
        }

        // 获取当前选中的题量
        function getSelectedCount() {
            let count = 5;
            radioInputs.forEach(radio => {
                if (radio.checked) {
                    count = parseInt(radio.value);
                }
            });
            return count;
        }

        // 事件绑定
        refreshBtn.addEventListener('click', () => {
            generateQuestions(getSelectedCount());
        });

        radioInputs.forEach(radio => {
            radio.addEventListener('change', () => {
                generateQuestions(getSelectedCount());
            });
        });

        // 页面加载完成后默认生成5道题
        document.addEventListener('DOMContentLoaded', () => {
            generateQuestions(5);
        });
    </script>
</body>
</html>
